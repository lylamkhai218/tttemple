name: Kiểm tra TTTemple

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated WebAuthn POC dependencies
        run: npm ci --prefix poc/auth/webauthn
      - run: pnpm test
      - run: pnpm build
      - name: Validate local WebAuthn Durable Object bundle
        run: pnpm exec wrangler deploy --dry-run --config poc/auth/webauthn/wrangler.local.jsonc
