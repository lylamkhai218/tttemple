name: Deploy TTTemple preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_PREVIEW to publish this branch to tttemple-vite-test
        required: true
        type: choice
        options:
          - SKIP
          - DEPLOY_PREVIEW
        default: SKIP

permissions:
  contents: read

concurrency:
  group: tttemple-vite-test-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/progress/2026-11-18' && inputs.confirmation == 'DEPLOY_PREVIEW'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run existing checks
        run: pnpm test

      - name: Build game assets
        run: pnpm build

      - name: Validate Worker package without deployment
        run: pnpm exec wrangler deploy --dry-run --config poc/vite-preview/wrangler.jsonc

      - name: Deploy confirmed preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config poc/vite-preview/wrangler.jsonc
