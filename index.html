<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#344438">
  <meta name="description" content="TTTemple - không gian chùa chung để trải nghiệm những phút bình yên.">
  <title>TTTemple - Chốn bình yên</title>
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/src/intro.css">
</head>
<body>
  <div id="app" inert></div>
  <div class="intro" id="intro" aria-label="Đang mở không gian chùa">
    <div class="intro-cloud intro-cloud-left" aria-hidden="true"><div class="intro-mist"></div></div>
    <div class="intro-cloud intro-cloud-right" aria-hidden="true"><div class="intro-mist"></div></div>
    <div class="intro-message">
      <img class="intro-logo" src="/logo-tttemple.webp" width="800" height="452" alt="TT Temple">
      <h1>Chào mừng thí chủ<br>ghé chùa</h1>
      <p class="intro-status" id="intro-status" role="status">Đang chuẩn bị không gian chùa...</p>
      <button id="intro-retry" type="button" hidden>Tải lại trang</button>
      <noscript>Cần bật JavaScript để mở không gian chùa.</noscript>
    </div>
  </div>
  <script>
    const introRetry = document.getElementById('intro-retry');
    introRetry.addEventListener('click', () => location.reload());
    setTimeout(() => {
      const intro = document.getElementById('intro');
      if (!intro || intro.classList.contains('is-opening') || !introRetry.hidden) return;
      document.getElementById('intro-status').textContent = 'Đang tải lâu hơn dự kiến. Thí chủ có thể chờ hoặc tải lại.';
      introRetry.hidden = false;
    }, 20000);
  </script>
  <script type="module" src="/src/boot.js"></script>
</body>
</html>
